<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash
      // light. Mirrors useApplyTheme() in src/hooks/useTheme.ts.
      (function () {
        var theme = "system";
        try {
          var saved = JSON.parse(
            localStorage.getItem("clipitup:settings") || "null",
          );
          if (saved && saved.state && saved.state.theme) {
            theme = saved.state.theme;
          }
        } catch (error) {
          // Storage unavailable or corrupt: fall back to the system theme.
        }
        var dark =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>ClipItUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
